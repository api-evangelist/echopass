name: Echopass
description: >-
  Echopass Corporation was a cloud-based (on-demand / hosted) contact center technology company,
  headquartered in the San Francisco Bay Area (San Ramon / Pleasanton, California) and backed by
  Canaan Partners among other venture investors. Its platform delivered multichannel, carrier-grade
  contact center and customer-interaction capabilities as a hosted service to enterprises. Echopass
  was acquired by Genesys in 2013 and folded into the Genesys customer-experience portfolio; it no
  longer operates as an independent company and publishes no live developer, API, or documentation
  surface. This profile is retained in the API Evangelist network for lineage and portfolio-graph
  purposes rather than as an active API provider.
